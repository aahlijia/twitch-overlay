<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing — Control</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      /* Colors — matches the overlay's cyan/magenta/yellow palette */
      --color-primary: #00FFFF;
      --color-secondary: #FF00FF;
      --color-accent-yellow: #ffe066;
      --color-background: #0a0a1a;
      --color-background-light: #1a1a2e;
      --color-text: #FFFFFF;
      --color-text-dim: #AAAAAA;
      --color-success: #5ecf5e;
      --color-error: #e55c5c;

      /* Typography — pixel font reserved for the heading, body stays legible */
      --font-pixel: 'Press Start 2P', cursive;
      --font-body: system-ui, sans-serif;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 2rem;

      /* Borders — hard-edged, not rounded */
      --border-width: 1px;
      --border-radius: 0;

      /* Transitions */
      --transition-fast: 0.15s ease;

      /* Layout */
      --container-max: 500px;
      --container-padding: var(--space-md);

      /* Accessibility */
      --touch-target-min: 44px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-body);
      padding: var(--space-lg) var(--container-padding) calc(var(--space-lg) * 2);
      max-width: var(--container-max);
      margin: 0 auto;
    }

    h1 {
      font-family: var(--font-pixel);
      font-size: 14px;
      margin-bottom: var(--space-sm);
    }

    .subtitle {
      font-size: 13px;
      color: var(--color-text-dim);
      margin-bottom: var(--space-lg);
    }

    /* ── Section headers ── */
    .section-header {
      font-size: 11px;
      color: var(--color-text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: var(--space-sm);
      padding-bottom: 6px;
      border-bottom: var(--border-width) solid var(--color-background-light);
    }

    section { margin-bottom: var(--space-lg); }

    /* ── Recent strip ── */
    #recent-strip {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-sm);
    }

    .recent-btn {
      padding: 9px 12px;
      font-size: 13px;
      background: var(--color-background-light);
      border: var(--border-width) solid var(--color-text-dim);
      border-radius: var(--border-radius);
      color: var(--color-text);
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: border-color var(--transition-fast), color var(--transition-fast);
    }

    .recent-btn:hover { border-color: var(--color-primary); }

    .recent-btn.active {
      border-color: var(--color-accent-yellow);
      color: var(--color-accent-yellow);
    }

    /* ── Game tabs ── */
    #game-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-sm);
    }

    .game-tab {
      padding: 7px 12px;
      font-size: 12px;
      background: var(--color-background-light);
      border: var(--border-width) solid var(--color-text-dim);
      border-radius: var(--border-radius);
      color: var(--color-text);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color var(--transition-fast);
    }

    .game-tab:hover { border-color: var(--color-primary); }

    .game-tab.active {
      background: var(--color-accent-yellow);
      border-color: var(--color-accent-yellow);
      color: var(--color-background);
      font-weight: 600;
    }

    /* ── Song list ── */
    #song-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      font-size: 14px;
      background: var(--color-background-light);
      border: var(--border-width) solid var(--color-text-dim);
      border-radius: var(--border-radius);
      color: var(--color-text);
      cursor: pointer;
      transition: border-color var(--transition-fast);
    }

    .song-btn:hover { border-color: var(--color-primary); }

    .song-btn.active {
      border-color: var(--color-accent-yellow);
      color: var(--color-accent-yellow);
    }

    #no-game-selected {
      font-size: 13px;
      color: var(--color-text-dim);
      padding: 10px 0;
    }

    /* ── Manual input ── */
    label {
      display: block;
      font-size: 12px;
      color: var(--color-text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 16px;
      background: var(--color-background-light);
      border: var(--border-width) solid var(--color-text-dim);
      border-radius: var(--border-radius);
      color: var(--color-text);
      margin-bottom: var(--space-sm);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    input[type="text"]:focus { border-color: var(--color-primary); }

    /* ── Buttons ── */
    .button-row { display: flex; gap: 8px; margin-bottom: 10px; }

    button {
      flex: 1;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-body);
      border: var(--border-width) solid transparent;
      border-radius: var(--border-radius);
      cursor: pointer;
    }

    #btn-show { background: var(--color-accent-yellow); color: var(--color-background); }
    #btn-hide {
      background: var(--color-background-light);
      color: var(--color-text-dim);
      border-color: var(--color-text-dim);
    }

    #btn-save-preset {
      width: 100%;
      margin-top: 2px;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      background: var(--color-background-light);
      border: var(--border-width) solid var(--color-success);
      border-radius: var(--border-radius);
      color: var(--color-success);
      cursor: pointer;
      transition: border-color var(--transition-fast);
    }

    #btn-save-preset:hover { border-color: var(--color-primary); }

    /* ── Status ── */
    #status {
      font-size: 13px;
      color: var(--color-text-dim);
      text-align: center;
      min-height: 20px;
      margin: 10px 0 0;
    }

    #status.ok  { color: var(--color-success); }
    #status.err { color: var(--color-error); }

    /* ── Currently on stream ── */
    .current-box {
      background: var(--color-background-light);
      border: var(--border-width) solid var(--color-text-dim);
      border-radius: var(--border-radius);
      padding: 14px;
    }

    #current-game { font-size: 15px; color: var(--color-accent-yellow); margin-bottom: 4px; }
    #current-song { font-size: 13px; color: var(--color-text); }

    /* ── Accessibility ── */
    :focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    @media (hover: none) and (pointer: coarse) {
      button, .game-tab, .song-btn, .recent-btn {
        min-height: var(--touch-target-min);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <h1>Now Playing</h1>
  <p class="subtitle">Update the stream overlay from any device on the network.</p>

  <!-- ── Preset browser ── -->
  <section>
    <div class="section-header">Setlist Presets</div>
    <div id="recent-strip"></div>
    <div id="game-tabs"><span style="color:#555;font-size:13px">Loading...</span></div>
    <div id="song-list">
      <div id="no-game-selected">Select a game above to see its songs.</div>
    </div>
  </section>

  <!-- ── Manual input ── -->
  <section>
    <div class="section-header">Manual / Custom</div>

    <label for="manual-game">Game / Franchise</label>
    <input type="text" id="manual-game" placeholder="e.g. Sonic the Hedgehog 2" />

    <label for="manual-song">Song (optional)</label>
    <input type="text" id="manual-song" placeholder="e.g. Chemical Plant Zone" />

    <div class="button-row">
      <button id="btn-show">Show on Stream</button>
      <button id="btn-hide">Hide</button>
    </div>

    <button id="btn-save-preset">+ Save to Presets</button>

    <div id="status"></div>
  </section>

  <!-- ── Current state ── -->
  <section>
    <div class="section-header">Currently on Stream</div>
    <div class="current-box">
      <div id="current-game">—</div>
      <div id="current-song"></div>
    </div>
  </section>

  <script>
    const manualGame = document.getElementById("manual-game");
    const manualSong = document.getElementById("manual-song");
    const statusEl   = document.getElementById("status");
    const currentGame = document.getElementById("current-game");
    const currentSong = document.getElementById("current-song");
    const gameTabs   = document.getElementById("game-tabs");
    const songList   = document.getElementById("song-list");
    const recentStrip = document.getElementById("recent-strip");

    let setlist = [];
    let activeGame = null;
    let activeSong = null;
    let recents = [];
    let lastState = { game: "", song: "", visible: false };

    // ── Status helper ──────────────────────────────────────────────
    function setStatus(msg, type = "ok") {
      statusEl.textContent = msg;
      statusEl.className = type;
      setTimeout(() => { statusEl.textContent = ""; statusEl.className = ""; }, 3000);
    }

    // ── Overlay state ──────────────────────────────────────────────
    function refreshCurrent(state) {
      lastState = state;
      currentGame.textContent = state.visible ? (state.game || "—") : "(hidden)";
      currentSong.textContent = state.song || "";
      renderRecents();
    }

    async function sendUpdate(payload) {
      try {
        const res = await fetch("/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          setStatus("Updated!", "ok");
          recents = data.recents;
          refreshCurrent(data.state);
        }
      } catch (e) {
        setStatus("Could not reach server.", "err");
      }
    }

    // ── Recent strip ────────────────────────────────────────────────
    function renderRecents() {
      recentStrip.innerHTML = "";

      if (recents.length === 0) {
        recentStrip.style.display = "none";
        return;
      }

      recentStrip.style.display = "flex";
      recents.forEach(entry => {
        const btn = document.createElement("button");
        const isActive = lastState.visible
          && lastState.game.toLowerCase() === entry.game.toLowerCase()
          && (lastState.song || "").toLowerCase() === (entry.song || "").toLowerCase();
        btn.className = "recent-btn" + (isActive ? " active" : "");
        btn.textContent = entry.song || entry.game;
        btn.addEventListener("click", () => {
          sendUpdate({ game: entry.game, song: entry.song, visible: true });
        });
        recentStrip.appendChild(btn);
      });
    }

    // ── Preset UI ──────────────────────────────────────────────────
    function renderGameTabs() {
      gameTabs.innerHTML = "";
      setlist.forEach(entry => {
        const btn = document.createElement("button");
        btn.className = "game-tab" + (entry.game === activeGame ? " active" : "");
        btn.textContent = entry.game;
        btn.addEventListener("click", () => selectGame(entry.game));
        gameTabs.appendChild(btn);
      });
    }

    function renderSongList() {
      songList.innerHTML = "";

      if (!activeGame) {
        songList.innerHTML = '<div id="no-game-selected">Select a game above to see its songs.</div>';
        return;
      }

      const entry = setlist.find(e => e.game === activeGame);
      if (!entry) return;

      entry.songs.forEach(song => {
        const btn = document.createElement("button");
        btn.className = "song-btn" + (song === activeSong ? " active" : "");
        btn.textContent = song;
        btn.addEventListener("click", () => selectSong(song));
        songList.appendChild(btn);
      });
    }

    function selectGame(game) {
      activeGame = game;
      activeSong = null;
      renderGameTabs();
      renderSongList();
    }

    function selectSong(song) {
      activeSong = song;
      renderSongList();
      // Also populate manual fields so user can tweak before sending if needed
      manualGame.value = activeGame;
      manualSong.value = song;
      // Send immediately
      sendUpdate({ game: activeGame, song, visible: true });
    }

    // ── Load setlist from server ───────────────────────────────────
    async function loadSetlist() {
      try {
        const res = await fetch("/setlist");
        setlist = await res.json();
        renderGameTabs();
        renderSongList();
      } catch (e) {
        gameTabs.innerHTML = '<span style="color:#e55;font-size:13px">Could not load setlist.</span>';
      }
    }

    // ── Save new song to presets ───────────────────────────────────
    document.getElementById("btn-save-preset").addEventListener("click", async () => {
      const game = manualGame.value.trim();
      const song = manualSong.value.trim();
      if (!game || !song) {
        setStatus("Enter a game and song to save.", "err");
        return;
      }
      try {
        const res = await fetch("/setlist/add-song", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ game, song })
        });
        const data = await res.json();
        if (data.ok) {
          setlist = data.setlist;
          setStatus(`Saved "${song}" to presets!`, "ok");
          // If the active game matches, re-render song list
          if (game.toLowerCase() === (activeGame || "").toLowerCase()) {
            renderSongList();
          } else {
            selectGame(setlist.find(e => e.game.toLowerCase() === game.toLowerCase())?.game || activeGame);
          }
          renderGameTabs();
        }
      } catch (e) {
        setStatus("Could not save preset.", "err");
      }
    });

    // ── Manual show/hide ──────────────────────────────────────────
    document.getElementById("btn-show").addEventListener("click", () => {
      sendUpdate({
        game: manualGame.value.trim(),
        song: manualSong.value.trim(),
        visible: true
      });
    });

    document.getElementById("btn-hide").addEventListener("click", () => {
      sendUpdate({ visible: false });
    });

    [manualGame, manualSong].forEach(el => {
      el.addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("btn-show").click();
      });
    });

    // ── Init ──────────────────────────────────────────────────────
    loadSetlist();
    fetch("/state").then(r => r.json()).then(refreshCurrent).catch(() => {});
    fetch("/recents").then(r => r.json()).then(r => { recents = r; renderRecents(); }).catch(() => {});
  </script>
</body>
</html>
