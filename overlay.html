<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Now Playing Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
    }

    /* ── Widget container ─────────────────────────────────────── */
    #widget {
      position: absolute;
      bottom: 48px;
      left: 48px;
      background: rgba(0, 0, 0, 0.82);
      border: 3px solid rgba(0, 255, 255, 0.4);
      border-radius: 4px;
      padding: 22px 28px 20px;
      min-width: 520px;
      max-width: 700px;

      box-shadow:
        0 0 12px rgba(0, 255, 255, 0.15),
        0 0 30px rgba(255, 0, 255, 0.08),
        inset 0 0 20px rgba(0, 0, 0, 0.5);

      transition: opacity 0.45s ease, transform 0.45s ease;
      opacity: 0;
      transform: translateY(14px);
    }

    #widget.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Divider between name and now-playing ─────────────────── */
    .divider {
      height: 1px;
      background: linear-gradient(to right, rgba(0,255,255,0.4), rgba(255,0,255,0.2), transparent);
      margin: 14px 0 14px;
    }

    /* ── Now playing label ────────────────────────────────────── */
    #label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    #game {
      font-size: 17px;
      color: #ffe066;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 2px 2px 0 rgba(255, 0, 255, 0.4);
    }

    #song {
      font-size: 13px;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #song:empty { display: none; }

    /* ── SOUND/TEST band name ─────────────────────────────────── */
    .band-name {
      position: relative;
      display: inline-block;
      font-size: 22px;
      color: #ffffff;
      text-shadow:
        4px 4px 0 #FF00FF,
        -2px -2px 0 #00FFFF,
        0 0 20px #00FFFF,
        0 0 40px #00FFFF,
        0 0 60px #FF00FF;
      animation:
        band-glow 3s ease-in-out infinite,
        glitch-skew 4s ease-in-out infinite;
    }

    .band-name::before,
    .band-name::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #fff;
    }

    .band-name::before {
      left: 2px;
      text-shadow: -2px 0 #FF00FF;
      clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    .band-name::after {
      left: -2px;
      text-shadow: -2px 0 #00FFFF, 2px 0 #FF00FF;
      clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim2 2.5s infinite linear alternate-reverse;
    }

    /* ── Keyframes ────────────────────────────────────────────── */
    @keyframes band-glow {
      0%, 100% {
        text-shadow:
          4px 4px 0 #FF00FF,
          -2px -2px 0 #00FFFF,
          0 0 20px #00FFFF,
          0 0 40px #00FFFF,
          0 0 60px #FF00FF;
      }
      50% {
        text-shadow:
          4px 4px 0 #FF00FF,
          -2px -2px 0 #00FFFF,
          0 0 30px #00FFFF,
          0 0 60px #00FFFF,
          0 0 90px #FF00FF,
          0 0 120px #FF00FF;
      }
    }

    @keyframes glitch-skew {
      0%, 100% { transform: skew(0deg); }
      20%       { transform: skew(0deg); }
      21%       { transform: skew(-1.5deg); }
      22%       { transform: skew(0deg); }
      70%       { transform: skew(0deg); }
      71%       { transform: skew(1deg); }
      72%       { transform: skew(0deg); }
    }

    @keyframes glitch-anim {
      0%   { clip: rect(42px, 9999px, 44px, 0); }
      5%   { clip: rect(12px, 9999px, 59px, 0); }
      10%  { clip: rect(48px, 9999px, 29px, 0); }
      15%  { clip: rect(42px, 9999px, 73px, 0); }
      20%  { clip: rect(63px, 9999px, 27px, 0); }
      25%  { clip: rect(34px, 9999px, 55px, 0); }
      30%  { clip: rect(86px, 9999px, 30px, 0); }
      35%  { clip: rect(23px, 9999px, 67px, 0); }
      40%  { clip: rect(58px, 9999px, 39px, 0); }
      45%  { clip: rect(14px, 9999px, 81px, 0); }
      50%  { clip: rect(71px, 9999px, 22px, 0); }
      55%  { clip: rect(37px, 9999px, 64px, 0); }
      60%  { clip: rect(52px, 9999px, 18px, 0); }
      65%  { clip: rect(8px,  9999px, 77px, 0); }
      70%  { clip: rect(44px, 9999px, 50px, 0); }
      75%  { clip: rect(29px, 9999px, 88px, 0); }
      80%  { clip: rect(66px, 9999px, 33px, 0); }
      85%  { clip: rect(19px, 9999px, 57px, 0); }
      90%  { clip: rect(74px, 9999px, 15px, 0); }
      95%  { clip: rect(41px, 9999px, 69px, 0); }
      100% { clip: rect(56px, 9999px, 24px, 0); }
    }

    @keyframes glitch-anim2 {
      0%   { clip: rect(65px, 9999px, 119px, 0); }
      5%   { clip: rect(28px, 9999px, 96px,  0); }
      10%  { clip: rect(77px, 9999px, 33px,  0); }
      15%  { clip: rect(14px, 9999px, 108px, 0); }
      20%  { clip: rect(91px, 9999px, 52px,  0); }
      25%  { clip: rect(46px, 9999px, 87px,  0); }
      30%  { clip: rect(103px,9999px, 21px,  0); }
      35%  { clip: rect(38px, 9999px, 114px, 0); }
      40%  { clip: rect(82px, 9999px, 43px,  0); }
      45%  { clip: rect(17px, 9999px, 99px,  0); }
      50%  { clip: rect(60px, 9999px, 76px,  0); }
      55%  { clip: rect(110px,9999px, 28px,  0); }
      60%  { clip: rect(32px, 9999px, 105px, 0); }
      65%  { clip: rect(88px, 9999px, 16px,  0); }
      70%  { clip: rect(54px, 9999px, 92px,  0); }
      75%  { clip: rect(7px,  9999px, 117px, 0); }
      80%  { clip: rect(73px, 9999px, 61px,  0); }
      85%  { clip: rect(25px, 9999px, 83px,  0); }
      90%  { clip: rect(97px, 9999px, 38px,  0); }
      95%  { clip: rect(49px, 9999px, 122px, 0); }
      100% { clip: rect(115px,9999px, 44px,  0); }
    }
  </style>
</head>
<body>
  <div id="widget">
    <span class="band-name" data-text="SOUND/TEST">SOUND/TEST</span>
    <div class="divider"></div>
    <div id="label">&#9654; Now Playing</div>
    <div id="game"></div>
    <div id="song"></div>
  </div>

  <script>
    const widget = document.getElementById("widget");
    const gameEl = document.getElementById("game");
    const songEl = document.getElementById("song");

    let lastVisible = null;
    let lastGame    = null;
    let lastSong    = null;

    async function poll() {
      try {
        const res  = await fetch("/state");
        const data = await res.json();

        if (data.game !== lastGame || data.song !== lastSong) {
          gameEl.textContent = data.game || "";
          songEl.textContent = data.song || "";
          lastGame = data.game;
          lastSong = data.song;
        }

        if (data.visible !== lastVisible) {
          widget.classList.toggle("visible", data.visible);
          lastVisible = data.visible;
        }
      } catch (e) {
        widget.classList.remove("visible");
      }
    }

    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
